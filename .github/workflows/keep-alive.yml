name: Keep Render alive

# Render free tier duerme el servicio tras ~15 min sin trafico y tarda 30-60s+ en
# despertar. Este ping cada 10 min evita el cold start durante pruebas de usuario.
# GitHub puede desactivar workflows programados si el repo queda 60 dias sin push -
# revisar Actions > este workflow si deja de correr solo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 https://taju-server.onrender.com/health)
            echo "Intento $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "El servicio no respondio 200 tras 3 intentos"
          exit 1
